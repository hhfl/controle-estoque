{% extends "base.html" %}
{% block conteudo %}
<h2>Categorias</h2>
<form method="post" action="{{ url_for('categorias.nova') }}" class="linha">
  <input name="nome" placeholder="Nome da nova categoria" maxlength="60" required>
  <button>Adicionar</button>
</form>
{% if categorias %}
<table>
  <tr><th>Categoria</th><th>Produtos</th><th>Ações</th></tr>
  {% for c in categorias %}
  <tr><td>{{ c.nome }}</td><td>{{ c.produtos|length }}</td>
    <td><form method="post" action="{{ url_for('categorias.excluir', categoria_id=c.id) }}" class="inline"
              onsubmit="return confirm('Excluir esta categoria?')">
      <button class="perigo">Excluir</button></form></td></tr>
  {% endfor %}
</table>
{% else %}<p>Nenhuma categoria cadastrada.</p>{% endif %}
{% endblock %}
